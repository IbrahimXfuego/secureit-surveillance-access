<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecureIT · Surveillance & Access</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101720;color:#e5eef5}body{margin:0}header,main,footer{max-width:1200px;margin:auto;padding:24px}header{border-bottom:1px solid #2d3c49}h1{margin:0;font-size:28px}p{color:#9eb1c3}main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2fr);gap:24px}.card{background:#192431;border:1px solid #2d3c49;border-radius:14px;padding:20px}h2{font-size:18px;margin-top:0}ul{list-style:none;padding:0;max-height:430px;overflow:auto}li{padding:12px 0;border-bottom:1px solid #2d3c49}time{display:block;font-size:12px;color:#9eb1c3;margin-top:4px}.granted{color:#77ddb2}.denied{color:#ff9898}img{width:100%;min-height:200px;object-fit:contain;background:#0c1118;border-radius:8px}a{color:#8bdbe4}footer{color:#9eb1c3;font-size:12px}@media(max-width:700px){main{grid-template-columns:1fr}header,main,footer{padding:16px}}</style></head>
<body><header><h1>SecureIT</h1><p>Local surveillance & access dashboard</p></header><main><section class="card"><h2>Access history</h2><p id="state" role="status">Loading…</p><ul id="logs"></ul></section><section class="card"><h2>Live camera</h2><img id="camera" alt="Live ESP32-CAM feed"><p id="camera-state" role="status">Connecting…</p><a id="stream-link" target="_blank" rel="noopener">Open stream</a></section></main><footer>Trusted local network · Access timestamps use your browser’s timezone.</footer>
<script>
const list=document.getElementById('logs'),state=document.getElementById('state');
async function refresh(){try{const r=await fetch('/api/logs');if(!r.ok)throw Error();const entries=await r.json();list.replaceChildren();for(const e of entries){const item=document.createElement('li'),label=document.createElement('strong'),time=document.createElement('time');label.textContent=e.event;label.className=e.event==='Access Granted'?'granted':'denied';time.dateTime=e.timestamp;time.textContent=new Date(e.timestamp).toLocaleString();item.append(label,time);list.append(item)}state.textContent=entries.length?'Updated '+new Date().toLocaleTimeString():'No access events yet.'}catch{state.textContent='Server unavailable. Retrying…'}}
const image=document.getElementById('camera'),cs=document.getElementById('camera-state');image.onload=()=>cs.textContent='Live feed connected.';image.onerror=()=>cs.textContent='Camera unavailable. Check power, Wi-Fi and CAMERA_URL, then reload.';
fetch('/api/config').then(r=>r.json()).then(c=>{image.src=c.stream;document.getElementById('stream-link').href=c.stream}).catch(()=>cs.textContent='Cannot load camera configuration.');refresh();setInterval(refresh,5000);
</script></body></html>
